name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go build, vet and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, creds]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ${{ matrix.service }}/go.mod

      - name: gofmt
        working-directory: ${{ matrix.service }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...

      - name: go test
        working-directory: ${{ matrix.service }}
        run: go test ./...

      - name: Cross-build the linux/amd64 runtime binary
        working-directory: ${{ matrix.service }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -buildvcs=false -trimpath -ldflags="-s -w" -o /tmp/out .
          ls -lh /tmp/out

  shell:
    name: Shell syntax and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every script
        run: |
          for f in scripts/*.sh; do bash -n "$f" || exit 1; done

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh

      - name: Scripts are executable
        run: |
          for f in scripts/*.sh; do
            test -x "$f" || { echo "not executable: $f"; exit 1; }
          done

      - name: Health command fails closed
        run: |
          cp .env.example .env
          if ./scripts/ops.sh health >/tmp/ops-health.out 2>&1; then
            echo "ops.sh health must fail when no gateway/components are running"
            cat /tmp/ops-health.out
            exit 1
          fi
          grep -q 'authd failed' /tmp/ops-health.out

  compose:
    name: Compose config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render placeholder config and validate
        run: |
          # Placeholder values only: this validates compose syntax, not a deployment.
          cp .env.example .env
          sed -i -e 's|^S3_REGION=.*|S3_REGION=us-east-1|' \
                 -e 's|^S3_ENDPOINT_HOST=.*|S3_ENDPOINT_HOST=s3.example.com|' \
                 -e 's|^S3_BUCKET_HOST=.*|S3_BUCKET_HOST=bucket.s3.example.com|' .env
          docker compose config >/dev/null
          echo "compose config OK"

      - name: Only the entry service may publish host ports
        run: |
          cp .env.example .env
          exposed="$(docker compose config --format json \
            | jq -r '.services | to_entries[] | select((.value.ports // []) | length > 0) | .key' \
            | sort | paste -sd, -)"
          echo "services publishing host ports: ${exposed:-<none>}"
          if [ "$exposed" != "nginx" ]; then
            echo "expected only nginx to publish a host port"
            exit 1
          fi

      - name: Support bundle keeps credentials unexpanded
        run: |
          cp .env.example .env
          sed -i -e 's|^S3_REGION=.*|S3_REGION=us-east-1|' \
                 -e 's|^S3_ENDPOINT_HOST=.*|S3_ENDPOINT_HOST=s3.example.com|' \
                 -e 's|^S3_BUCKET_HOST=.*|S3_BUCKET_HOST=bucket.s3.example.com|' \
                 -e 's|^S3_ACCESS_KEY=.*|S3_ACCESS_KEY=ci-access-marker|' \
                 -e 's|^S3_SECRET_KEY=.*|S3_SECRET_KEY=ci-secret-marker|' .env
          bundle="$(./scripts/ops.sh bundle | sed -n 's/^support bundle: //p')"
          test -f "$bundle"
          extracted="$(mktemp -d)"
          tar -xzf "$bundle" -C "$extracted"
          if grep -Rqs 'ci-access-marker\|ci-secret-marker' "$extracted"; then
            echo "support bundle leaked interpolated credentials"
            exit 1
          fi
          grep -Rq '${S3_ACCESS_KEY:-}' "$extracted"
          test "$(stat -c %a "$bundle")" = 600
          test "$(stat -c %a "${bundle%.tgz}")" = 700

  secrets:
    name: No credentials in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Key-shaped strings and private keys
        run: |
          if grep -RInE --exclude-dir=.git --exclude=ci.yml --exclude='*.crt' \
            'AKLT[A-Za-z0-9]{12,}|AKIA[A-Z0-9]{16}|LTAI[A-Za-z0-9]{12,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' .; then
            echo "potential credential committed"
            exit 1
          fi

      - name: Example env carries no secret value
        run: |
          if grep -En '^(S3_ACCESS_KEY|S3_SECRET_KEY|TEST_VIRT_SK|VOLC_SECRET_KEY)=.+' .env.example; then
            echo ".env.example must not contain credentials"
            exit 1
          fi

      - name: Real config and key store are not committed
        run: |
          for f in .env auth/keys_audit.log; do
            if git ls-files --error-unmatch "$f" 2>/dev/null; then
              echo "$f must never be committed"; exit 1
            fi
          done
          # keys.json may exist as an empty placeholder, but never with real keys.
          if git ls-files --error-unmatch auth/keys.json 2>/dev/null; then
            if [ "$(tr -d '[:space:]' < auth/keys.json)" != "{}" ]; then
              echo "auth/keys.json must be an empty placeholder"; exit 1
            fi
          fi
