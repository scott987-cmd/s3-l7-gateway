# nginx-unprivileged 镜像 master 以非 root(UID 101) 运行，user 指令无效且会告警，故注释。
# user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log  notice;
pid        /tmp/nginx.pid;   # unprivileged 镜像默认 pid 路径,避免 /var/run 需 root

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- 审计日志:调用方/方法/对象 key/状态/耗时/上游耗时 ----
    #   access_key 由 authd 验签通过后回传(auth_request_set $s3_access_key)
    log_format s3audit escape=json
        '{'
        '"ts":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"access_key":"$s3_access_key",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"has_query":"$is_args",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/s3audit.log s3audit;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # ---- 安全:隐藏 nginx 版本号(降低指纹暴露)----
    server_tokens off;

    # ---- 抗慢速攻击(Slowloris / slow-body):限制握手与收发阶段的最长停顿 ----
    client_header_timeout 10s;
    client_body_timeout   30s;
    send_timeout          30s;

    # 大对象上传:5g 对齐常见 S3 单次 PUT 的硬上限,防止畸形超大请求体耗尽资源。
    #   - 下载(GET)走响应体,完全不受此限;
    #   - >5GB 的文件按 S3 规范【必须走分片上传】,此处约束的是【单个分片】而非整个文件,
    #     故 100GB 级大文件经 Multipart 分片(每片默认几十 MB)照传不误,不会被 413 拦截;
    #   - 配合 proxy_request_buffering off,大对象仍为流式转发,此校验不触发缓冲。
    client_max_body_size 5g;
    client_body_buffer_size 1m;
    proxy_request_buffering off;   # 流式转发,避免大文件落盘
    proxy_buffering off;

    # ---- 限流:按客户端 IP,10r/s + 突发 20(按需调整) ----
    limit_req_zone $binary_remote_addr zone=s3_rl:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=s3_conn:10m;

    include /etc/nginx/conf.d/*.conf;
}
